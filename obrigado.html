<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Política de Segurança de Conteúdo — restringe de onde podem vir scripts,
       estilos, imagens e fontes, impede injeção de <base> e plugins, e limita o
       destino dos formulários ao FormSubmit.
       Nota: 'frame-ancestors' (anti-clickjacking) só funciona em cabeçalho HTTP,
       que o GitHub Pages não permite definir. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; form-action https://formsubmit.co; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='72' font-size='68' font-family='Georgia,serif' fill='%23c9a84c' text-anchor='middle'>B</text></svg>">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <title>Marcação enviada — Bella Hair</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>tailwind.config={theme:{extend:{colors:{navy:'#000000',navy2:'#0d0d0d',gold:'#c9a84c'},fontFamily:{serif:['"Cormorant Garamond"','serif'],sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-navy text-[#eef1f4] font-sans antialiased min-h-screen flex flex-col items-center justify-center px-6">

  <div class="text-center max-w-md fade-up">
    <p class="text-gold text-4xl mb-6">✦</p>
    <h1 class="font-serif text-4xl md:text-5xl font-light mb-4">
      Marcação <em class="text-gold">enviada!</em>
    </h1>
    <div class="w-12 h-px bg-gold mx-auto my-6"></div>
    <p class="text-[#eef1f4]/55 font-light leading-relaxed text-sm mb-3">
      Recebemos o seu pedido. Entraremos em contacto brevemente para confirmar a disponibilidade.
    </p>
    <p class="text-[#eef1f4]/55 text-xs mb-10">
      Para confirmação imediata ligue para
      <a href="tel:913533917" class="text-gold">913 533 917</a>
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="index.html" class="btn-primary">← Voltar ao site</a>
      <a href="marcacoes.html" class="btn-outline">Nova marcação</a>
    </div>
  </div>

  <p class="absolute bottom-8 text-[#eef1f4]/55 text-xs">Bella Hair by Leandro Oliveira · Paredes</p>

  <script>
    document.querySelectorAll('.fade-up').forEach((el,i)=>{
      el.style.animation=`fadeUp 700ms cubic-bezier(0.23,1,0.32,1) ${i*120}ms both`;
    });
  </script>
</body>
</html>
